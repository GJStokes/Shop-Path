function remapStandardCategories(){
  const aliases={
    "Pantry":"Pantry Staples",
    "Drinks":"Drinks",
    "Pasta & Noodles":"Pasta & Noodles",
    "Asian Ingredients":"Asian & International Foods",
    "Baking & Cooking Essentials":"Baking & Cooking",
    "Household & Cleaning":"Household Cleaning"
  };
  const itemCategoryByName=Object.fromEntries(BASE_ITEMS.map(x=>[x.name,x.category]));
  let changed=false;
  state.items.forEach(x=>{
    const mapped=itemCategoryByName[x.name];
    if(mapped && x.category!==mapped){x.category=mapped;changed=true;}
    else if(aliases[x.category] && x.category!==aliases[x.category]){x.category=aliases[x.category];changed=true;}
  });
  const next=[];
  state.categories.forEach(c=>{
    const mapped=aliases[c]||c;
    if(!next.some(x=>x.toLowerCase()===mapped.toLowerCase())) next.push(mapped);
    if(mapped!==c)changed=true;
  });
  CATEGORIES.forEach(c=>{if(!next.some(x=>x.toLowerCase()===c.toLowerCase())){next.push(c);changed=true;}});
  state.categories=next;
  return changed;
}
function migrateLegacyStoreNameInLocalState(){
  const legacy="PAK\'nSAVE";
  const canonical="Pak N Save";
  let changed=false;
  if(Array.isArray(state.stores)){
    const hadCanonical=state.stores.some(st=>String(st).toLowerCase()===canonical.toLowerCase());
    const hadLegacy=state.stores.some(st=>String(st).toLowerCase()===legacy.toLowerCase());
    if(hadLegacy){
      state.stores=state.stores.map(st=>String(st).toLowerCase()===legacy.toLowerCase()?(hadCanonical?canonical:canonical):st);
      state.stores=[...new Set(state.stores.map(String))];
      changed=true;
    }
  }
  for(const item of (state.items||[])){
    if(String(item.store||"").toLowerCase()===legacy.toLowerCase()){item.store=canonical;changed=true;}
    if(String(item.shopStore||"").toLowerCase()===legacy.toLowerCase()){item.shopStore=canonical;changed=true;}
  }
  for(const maps of [state.routesByStore,state.pairsByStore,state.orderStatsByStore,state.lastRoutesByStore]){
    if(!maps||typeof maps!=="object")continue;
    if(Object.prototype.hasOwnProperty.call(maps,legacy)){
      maps[canonical]=maps[legacy];
      delete maps[legacy];
      changed=true;
    }
  }
  return changed;
}

function normalizeState(){

  state.stores=Array.isArray(state.stores)?state.stores:[];
  state.categories=[];
  state.route=Array.isArray(state.route)?state.route:[];
  state.pairs=state.pairs&&typeof state.pairs==='object'?state.pairs:{};
  state.routesByStore=state.routesByStore&&typeof state.routesByStore==='object'?state.routesByStore:{};
  state.pairsByStore=state.pairsByStore&&typeof state.pairsByStore==='object'?state.pairsByStore:{};

  state.orderStatsByStore=state.orderStatsByStore&&typeof state.orderStatsByStore==='object'?state.orderStatsByStore:{};
  // Do not auto-add DEFAULT_STORES here. Stores can be intentionally deleted.
  state.items.forEach(x=>{
    x.category="";
    if(!x.store)x.store="Pak N Save";
    if(!x.shopStore)x.shopStore=x.store;

function pairwiseLearningScore(id,store,selectedIds){
  const stats=state.orderStatsByStore[store]||{};
  let wins=0, losses=0, margin=0, observed=0;
  for(const other of selectedIds){
    if(other===id)continue;
    const forward=Number(stats[id+"|"+other]||0);
    const reverse=Number(stats[other+"|"+id]||0);
    if(forward>reverse)wins++;
    else if(reverse>forward)losses++;
    margin += forward-reverse;
    observed += forward+reverse;
  }
  return {wins,losses,margin,observed};
}

  if(ap!==bp)return ap-bp;
  return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});
}

      // the weakest remaining incoming constraint, then continue topologically.
      const remaining=ids.filter(id=>!placed.has(id));
      let breakLoser=remaining[0], breakWinner=null, weakest=Infinity;
      for(const loser of remaining){
        for(const [winner,edges] of outgoing.entries()){
          if(placed.has(winner))continue;
          const edge=edges.get(loser);
          if(edge && edge.strength<weakest){weakest=edge.strength;breakLoser=loser;breakWinner=winner;}
        }
      }
      if(breakWinner!==null) {
        const edge=outgoing.get(breakWinner).get(breakLoser);
        outgoing.get(breakWinner).delete(breakLoser);
        indegree.set(breakLoser,Math.max(0,indegree.get(breakLoser)-1));
        candidates=ids.filter(id=>!placed.has(id)&&indegree.get(id)===0);
      }
      if(!candidates.length)candidates=remaining;
    }

    candidates.sort((a,b)=>{
      const sa=pairwiseLearningScore(a,store,ids), sb=pairwiseLearningScore(b,store,ids);
      if(sa.wins!==sb.wins)return sb.wins-sa.wins;
      if(sa.margin!==sb.margin)return sb.margin-sa.margin;
      return compareLatestTie(byId.get(a),byId.get(b),lastPos);
    });

    const chosen=candidates[0];
    order.push(byId.get(chosen));
    placed.add(chosen);
    for(const loser of outgoing.get(chosen).keys()){
      if(!placed.has(loser))indegree.set(loser,Math.max(0,indegree.get(loser)-1));
    }
  }

  return order;
}
function ensureStore(store){store=(store||"").trim();if(!store)throw new Error("A store is required.");if(!state.stores.includes(store))state.stores.push(store);if(!state.routesByStore[store])state.routesByStore[store]=[];if(!state.pairsByStore[store])state.pairsByStore[store]={};if(!state.orderStatsByStore[store])state.orderStatsByStore[store]={};return store}
function filterCards(q){

      s.style.display="";

      });
    });

  }

  const matches=[];

  document.querySelectorAll("#masterSections .item-card").forEach(card=>{

  if(matches.length){
    matches.forEach(card=>box.appendChild(card));
  }else{
    box.insertAdjacentHTML(
      "beforeend",
      '<div class="muted">No items found.</div>'
    );
  }

  const search=document.getElementById("search");

async function cloudRenameStore(oldName,newName){
  if(!currentUser||!cloudReady)return;
  const uid=currentUser.id;
  const {data:oldRows,error:oldErr}=await db.from("stores").select("id,name").eq("user_id",uid).eq("name",oldName).limit(1);
  if(oldErr)throw oldErr;
  const oldRow=Array.isArray(oldRows)&&oldRows.length?oldRows[0]:null;
  if(!oldRow) {
    // The local store may have been created or renamed on another device.
    // The regular sync path will still persist the current name.
    await syncMasterData();
    return;
  }
  const {data:newRows,error:newErr}=await db.from("stores").upsert({user_id:uid,name:newName,sort_order:oldRow.sort_order},{onConflict:"user_id,name"}).select("id").limit(1);
  if(newErr)throw newErr;
  const newRow=Array.isArray(newRows)&&newRows.length?newRows[0]:null;
  const newId=newRow?.id||null;
  if(oldRow.id!==newId){
    let r=await db.from("master_items").update({default_store_id:newId}).eq("user_id",uid).eq("default_store_id",oldRow.id);
    if(r.error)throw r.error;
    r=await db.from("shopping_trip_items").update({store_id:newId,store_name:newName}).eq("user_id",uid).eq("store_id",oldRow.id);
    if(r.error)throw r.error;
  }
  let r=await db.from("route_pairs").update({store_name:newName}).eq("user_id",uid).eq("store_name",oldName);
  if(r.error)throw r.error;
  r=await db.from("latest_store_routes").update({store_name:newName}).eq("user_id",uid).eq("store_name",oldName);
  if(r.error)throw r.error;
  r=await db.from("stores").delete().eq("user_id",uid).eq("id",oldRow.id);
  if(r.error)throw r.error;
}
async function cloudDeleteStore(name,replacement){
  if(!currentUser||!cloudReady)return;
  const uid=currentUser.id;
  const {data:rows,error}=await db.from("stores").select("id").eq("user_id",uid).eq("name",name).limit(1);
  if(error)throw error;
  const row=Array.isArray(rows)&&rows.length?rows[0]:null;
  if(!row)return;
  if(replacement){
    const {data:replRows,error:replErr}=await db.from("stores").select("id").eq("user_id",uid).eq("name",replacement).limit(1);
    if(replErr)throw replErr;
    const repl=Array.isArray(replRows)&&replRows.length?replRows[0]:null;
    if(!repl)throw new Error(`Replacement store "${replacement}" was not found.`);
    let r=await db.from("master_items").update({default_store_id:repl.id}).eq("user_id",uid).eq("default_store_id",row.id);
    if(r.error)throw r.error;
    r=await db.from("shopping_trip_items").update({store_id:repl.id,store_name:replacement}).eq("user_id",uid).eq("store_id",row.id);
    if(r.error)throw r.error;
  } else {
    let r=await db.from("master_items").update({default_store_id:null}).eq("user_id",uid).eq("default_store_id",row.id);
    if(r.error)throw r.error;
    r=await db.from("shopping_trip_items").update({store_id:null,store_name:null}).eq("user_id",uid).eq("store_id",row.id);
    if(r.error)throw r.error;
  }
  // Route history is intentionally preserved under its recorded store name.
  // The deleted store's future route can be recreated if the same name is added again.
  const r=await db.from("stores").delete().eq("user_id",uid).eq("id",row.id);
  if(r.error)throw r.error;
}
async function renameStore(oldName){
  const next=prompt("Rename store:",oldName);
  if(next===null)return;
  const name=next.trim();
  if(!name||name===oldName)return;
  if(state.stores.some(st=>st.toLowerCase()===name.toLowerCase())){alert("That store already exists.");return;}

  state.stores=state.stores.map(st=>st===oldName?name:st);
  for(const maps of [state.routesByStore,state.pairsByStore,state.orderStatsByStore,state.lastRoutesByStore]){
    if(maps[oldName]){maps[name]=maps[oldName];delete maps[oldName];}
  }
  state.items.forEach(x=>{if(x.store===oldName)x.store=name;if(x.shopStore===oldName)x.shopStore=name;});
  saveLocal();
  openStoreManager();
  try{
    setSyncStatus("Syncing…");
    await cloudRenameStore(oldName,name);
    await syncMasterData();
    await replaceCloudRoutes(true);
    localDirty=false;
    setCloudSnapshotSignature(currentUser.id,state);
    setSyncStatus("Synced");
  }catch(err){
    console.error("Store rename sync error:",err);
    setSyncStatus("Sync error");
    alert(`Store renamed locally, but cloud sync failed.\n\n${err?.message||String(err)}`);
  }
}
async function deleteStore(name){
  if(state.stores.length<=1){alert("Keep at least one store.");return;}
  const assigned=state.items.filter(x=>x.store===name||x.shopStore===name);
  let replacement=null;
  if(assigned.length){
    const choices=state.stores.filter(st=>st!==name);
    const menu=choices.map((st,i)=>`${i+1}. ${st}`).join("\n");
    const answer=prompt(`\"${name}\" is assigned to ${assigned.length} item${assigned.length===1?"":"s"}.\n\nChoose the replacement store by number, or Cancel to stop.\n\n${menu}`);
    if(answer===null)return;
    const idx=Number(answer)-1;
    if(!Number.isInteger(idx)||!choices[idx]){alert("Please enter a valid replacement store number.");return;}
    replacement=choices[idx];
  }
  if(!confirm(`Delete "${name}" from your store list?${replacement?`\n\n${assigned.length} assigned item${assigned.length===1?"":"s"} will be moved to "${replacement}".`:""}`))return;
  if(replacement){state.items.forEach(x=>{if(x.store===name)x.store=replacement;if(x.shopStore===name)x.shopStore=replacement;});}
  state.stores=state.stores.filter(st=>st!==name);
  delete state.routesByStore[name];delete state.pairsByStore[name];delete state.orderStatsByStore[name];delete state.lastRoutesByStore[name];
  saveLocal();
  openStoreManager();
  try{
    setSyncStatus("Syncing…");
    await cloudDeleteStore(name,replacement);
    await syncMasterData();
    await replaceCloudRoutes(true);
    localDirty=false;
    setCloudSnapshotSignature(currentUser.id,state);
    setSyncStatus("Synced");
  }catch(err){
    console.error("Store delete sync error:",err);
    setSyncStatus("Sync error");
    alert(`Store deleted locally, but cloud sync failed.\n\n${err?.message||String(err)}`);
  }
}

async function renderMaster(app){
  // Start with alphabetical order so the list renders immediately.
  const items=[...state.items].sort(
    (a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"})
  );

  const uid=currentUser?.id||"";
  const migrationNotice=
    (!hasMigrationCompleted(uid)&&deviceLocalDataAvailable)

  app.innerHTML=`

    <div class="bar">
      <input id="search" placeholder="Search master list…">
      <button class="primary" onclick="openAdd()">Add Item</button>
    </div>

    <div class="bar">
      <button class="secondary" onclick="openStoreManager()">＋ Add Store</button>
    </div>

    <p class="muted">
      Tap an item to include it in this week's shop. Tap an item to set amount and store.
    </p>

    <div id="masterSections">
      <div class="section master-all-items">
        <h2>All Items</h2>
        ${
          items.length
            ? items.map(x=>`
                <div class="card item-card" data-name="${esc(x.name.toLowerCase())}">
                  <div class="row">
                    <button
                      class="buy ${x.selected?"done":""}"
                      onclick="toggleSelect(decodeURIComponent('${encodeURIComponent(x.id)}'))"
                    >
                      ${x.selected?"✓":"+"}
                    </button>

                    <button
                      class="itemname item-open"
                      type="button"
                      onclick="editItem(decodeURIComponent('${encodeURIComponent(x.id)}'))"
                    >
                      ${esc(x.name)}
                      <div class="cat">
                        ${esc(x.usualQty||"1")} ${esc(x.usualUnit||"each")}
                        · Default: ${esc(x.store||"Pak N Save")}
                      </div>
                      <div class="storetag">
                        Tap item to edit default settings
                      </div>
                    </button>

                    <button
                      class="secondary"
                      onclick="editItem(decodeURIComponent('${encodeURIComponent(x.id)}'))"
                    >
                      Edit
                    </button>

                    <button
                      class="secondary"
                      onclick="deleteItem(decodeURIComponent('${encodeURIComponent(x.id)}'))"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              `).join("")
            : `<div class="muted">No items yet.</div>`
        }
      </div>
    </div>
  `;

  document.getElementById("search").oninput=e=>filterCards(e.target.value);

  // Sort the existing item cards by how often each item was bought.
  // Uses the same household-oriented last-10 completed trips as New Trip.
  if(!currentUser)return;

  try{
    const tripsRes=await db.from("shopping_trips")
      .select("id,completed_at,created_at")
      .eq("user_id",currentUser.id)
      .eq("status","completed")
      .order("completed_at",{ascending:false})
      .limit(50);

    if(tripsRes.error)throw tripsRes.error;

    const allTrips=tripsRes.data||[];
    if(!allTrips.length)return;

    const itemRowsRes=await db.from("shopping_trip_items")
      .select("trip_id,item_name,bought,route_position")
      .eq("user_id",currentUser.id)
      .in("trip_id",allTrips.map(t=>t.id))
      .eq("bought",true)
      .not("route_position","is",null);

    if(itemRowsRes.error)throw itemRowsRes.error;

    const itemRows=itemRowsRes.data||[];

    // Ignore empty/invalid completed trips, matching New Trip behaviour.
    const tripsWithBoughtItems=new Set(
      itemRows.map(row=>row.trip_id).filter(Boolean)
    );

    const validTrips=allTrips
      .filter(t=>tripsWithBoughtItems.has(t.id))
      .slice(0,10);

    if(!validTrips.length)return;

    const recentIds=new Set(validTrips.map(t=>t.id));

    // Count each item once per completed trip.
    const frequency=new Map();

    for(const row of itemRows){
      if(!recentIds.has(row.trip_id)||!row.item_name)continue;

      const key=String(row.item_name).trim().toLowerCase();
      if(!key)continue;

      if(!frequency.has(key))frequency.set(key,new Set());
      frequency.get(key).add(row.trip_id);
    }

    const container=document.querySelector(
      "#masterSections .master-all-items"
    );

    if(!container)return;

    const cards=[...container.querySelectorAll(".item-card")];

    cards.sort((a,b)=>{
      const nameA=(a.dataset.name||"").toLowerCase();

async function clearRoute(){
  if(!confirm("Clear all learned route history for every store? Your Master List and current weekly shop will not be changed."))return;
  // Clear route-learning data locally while leaving Master List, stores, categories
  // and the current weekly shopping selection untouched.
  state.routesByStore={};
  state.pairsByStore={};
  state.orderStatsByStore={};
  state.lastRoutesByStore={};
  saveLocal();
  render();
  if(currentUser && cloudReady){
    setSyncStatus("Clearing learned routes…");
    try{
      const uid=currentUser.id;
      // Route learning is derived from completed shopping trips. Remove those
      // completed trip records too, otherwise a later rebuild could resurrect
      // routes the user explicitly asked to clear. Leave any open/current trip alone.
      const done=await db.from("shopping_trips").select("id").eq("user_id",uid).eq("status","completed");
      if(done.error)throw done.error;
      const completedIds=(done.data||[]).map(r=>r.id).filter(Boolean);
      if(completedIds.length){
        const di=await db.from("shopping_trip_items").delete().in("trip_id",completedIds).eq("user_id",uid);
        if(di.error)throw di.error;
        const dt=await db.from("shopping_trips").delete().in("id",completedIds).eq("user_id",uid);
        if(dt.error)throw dt.error;
      }
      const [pairs,routes]=await Promise.all([
        db.from("route_pairs").delete().eq("user_id",uid),
        db.from("latest_store_routes").delete().eq("user_id",uid)
      ]);
      if(pairs.error)throw pairs.error;
      if(routes.error)throw routes.error;
      setSyncStatus("Synced");
    }catch(err){
      console.error("Clear learned routes error:",err);
      setSyncStatus("Sync error");
      alert("The local learned routes were cleared, but the cloud could not be updated. Please try again.");
    }
  }
}

function removeFromWeek(id){
  const x=state.items.find(item=>item.id===id);
  if(!x)return;

  // Remove this item from the current week's shop.
  x.selected=false;
  x.bought=false;

  // If there are no unbought items left, but there are bought items,
  // the trip is now complete. Complete it immediately.
  const remainingUnbought=state.items.some(
    item=>item.selected&&!item.bought
  );

  const boughtSelected=state.items.some(
    item=>item.selected&&item.bought
  );

  if(!remainingUnbought && boughtSelected){
    const completed={};

    for(const [store,route] of Object.entries(state.routesByStore||{})){
      const clean=[...new Set((route||[]).filter(Boolean))];
      if(clean.length){
        completed[store]=clean;
      }
    }

    // Clear bought items from This Week and Master List.
    state.items.forEach(item=>{
      if(item.selected&&item.bought){
        item.selected=false;
        item.bought=false;
      }
    });

    // Prevent the normal background sync from racing the completion.
    completionInProgress=true;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer=null;

    // Clear the active trip locally.
    state.routesByStore={};
    state.route=[];
    state.shopStarted=null;

    saveLocal();
    render();

    // Commit the completed trip to the cloud.
    syncCompletedTrip(completed).catch(err=>{
      console.error("Complete trip after remove error:",err);
      setSyncStatus("Sync error");
    });

    return;
  }

  // Normal removal when the trip is not yet complete.
  saveLocal();
  render();
  queueCloudSync();
}

function buy(id){
  const it=state.items.find(x=>x.id===id);
  if(!it)return;
  if(it.bought)return;
  const store=ensureStore(it.shopStore||it.store);
  if(!state.shopStarted)state.shopStarted=Date.now();
  const route=state.routesByStore[store];
  // Never record the same item twice in one active trip, even if a stale UI state
  // or repeated tap attempts somehow reach this handler.
  if(!route.includes(id)){
    const prev=route[route.length-1];
    if(prev&&prev!==id){const k=prev+"|"+id;state.pairsByStore[store][k]=(state.pairsByStore[store][k]||0)+1;}
    route.push(id);
  }
  it.bought=true;
  const remaining=state.items.some(x=>x.selected&&!x.bought);
  if(!remaining){
    const completed={};
    for(const [st,r] of Object.entries(state.routesByStore||{})){
      const clean=[...new Set((r||[]).filter(Boolean))];
      if(!clean.length)continue;
      completed[st]=clean;
      const stats=state.orderStatsByStore[st]??={};
      for(let i=0;i<clean.length;i++)for(let j=i+1;j<clean.length;j++)if(clean[i]!==clean[j])stats[clean[i]+"|"+clean[j]]=(stats[clean[i]+"|"+clean[j]]||0)+1;
      state.orderStatsByStore[st]=stats;
      state.lastRoutesByStore[st]=[...clean];
    }
    state.items.forEach(x=>{if(x.selected&&x.bought){x.selected=false;x.bought=false}});
    // Completion is authoritative. Block ordinary background syncing while the
    // completed trip is being committed, and cancel any queued sync first.
    completionInProgress=true;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer=null;
    state.routesByStore={};state.route=[];state.shopStarted=null;saveLocal();render();
    syncCompletedTrip(completed).catch(err=>{console.error("Complete trip sync error:",err);setSyncStatus("Sync error")});
    return;
  }
  saveLocal();render();queueCloudSync();
}

async function resetBought(){
  if(!currentUser||!cloudReady){alert("Please wait for Shop Path to finish syncing before starting a new trip.");return;}
  try{
    setSyncStatus("Building your usual shop…");

    // Build a fresh weekly shop from household buying frequency, not from one
    // store's frequency in isolation. An item's Master List store is its
    // preferred/default store; purchases at other stores still count toward
    // whether the item is regularly bought, but never change that preference.
    // Use up to the last 10 completed, non-empty trips overall.
    const uid=currentUser.id;
    const tripsRes=await db.from("shopping_trips")
      .select("id,completed_at,created_at")
      .eq("user_id",uid)
      .eq("status","completed")
      .order("completed_at",{ascending:false})
      .limit(50);
    if(tripsRes.error)throw tripsRes.error;
    const allTrips=tripsRes.data||[];
    if(!allTrips.length){
      state.items.forEach(x=>{x.selected=false;x.bought=false;});
      state.routesByStore={};state.route=[];state.shopStarted=null;
      saveLocal();render();queueCloudSync();setSyncStatus("Synced");
      alert("There is no completed shopping history yet. Your new shop is empty — add items from Master List.");
      return;
    }

    // Load all recorded bought route rows for the completed trips. An old sync
    // race could create completed trips with no route rows; those are invalid
    // for frequency learning and must not dilute the household denominator.
    const itemRowsRes=await db.from("shopping_trip_items")
      .select("trip_id,item_name,store_name,route_position,bought")
      .eq("user_id",uid)
      .in("trip_id",allTrips.map(t=>t.id))
      .eq("bought",true)
      .not("route_position","is",null);
    if(itemRowsRes.error)throw itemRowsRes.error;
    const itemRows=itemRowsRes.data||[];

    const tripsWithBoughtItems=new Set(itemRows.map(row=>row.trip_id).filter(Boolean));
    const validTrips=allTrips.filter(t=>tripsWithBoughtItems.has(t.id)).slice(0,10);
    if(!validTrips.length){
      state.items.forEach(x=>{x.selected=false;x.bought=false;});
      state.routesByStore={};state.route=[];state.shopStarted=null;
      saveLocal();render();queueCloudSync();setSyncStatus("Synced");
      alert("There is no completed shopping history yet. Your new shop is empty — add items from Master List.");
      return;
    }

    const recentIds=new Set(validTrips.map(t=>t.id));
    const selectedNames=new Set();
    const activeStores=new Map((state.stores||[]).map(st=>[String(st||"").trim().toLowerCase(),st]));
    const boughtTripIdsByItem=new Map();
    for(const row of itemRows){
      if(!row.trip_id||!recentIds.has(row.trip_id)||!row.item_name)continue;
      const nameKey=String(row.item_name).trim().toLowerCase();
      if(!nameKey)continue;
      if(!boughtTripIdsByItem.has(nameKey))boughtTripIdsByItem.set(nameKey,new Set());
      boughtTripIdsByItem.get(nameKey).add(row.trip_id);
    }

    state.items.forEach(x=>{x.selected=false;x.bought=false;});

    // Manual overrides are evaluated first.
    for(const item of state.items){
      const mode=item.newTripMode||"auto";
      const store=String(item.store||"").trim();
      const storeKey=store.toLowerCase();
      if(mode==="always" && store && activeStores.has(storeKey)){
        item.selected=true;
        item.bought=false;
        item.shopStore=activeStores.get(storeKey);
        item.shopQty=item.usualQty||"1";
        item.shopUnit=item.usualUnit||"each";
        selectedNames.add(item.id);
      }
    }

    // Automatic mode: include an item when it was bought on at least 80% of the
    // last 10 valid completed household trips, regardless of supplying store.
    // The item's own default store remains the preferred store for this new shop.
    const total=validTrips.length;
    for(const item of state.items){
      if((item.newTripMode||"auto")!=="auto")continue;
      const store=String(item.store||"").trim();
      const storeKey=store.toLowerCase();
      if(!storeKey||!activeStores.has(storeKey))continue;

      const nameKey=String(item.name||"").trim().toLowerCase();
      const boughtTrips=boughtTripIdsByItem.get(nameKey)||new Set();
      const frequency=boughtTrips.size/total;
      if(frequency<0.8)continue;

      item.selected=true;
      item.bought=false;
      item.shopStore=activeStores.get(storeKey);
      item.shopQty=item.usualQty||"1";
      item.shopUnit=item.usualUnit||"each";
      selectedNames.add(item.id);
    }

    state.routesByStore={};state.route=[];state.shopStarted=null;
    saveLocal();render();
    await syncMasterData();
    localDirty=false;
    setCloudSnapshotSignature(uid,state);
    setSyncStatus("Synced");
    if(!selectedNames.size){
      alert("No items are bought on at least 80% of your last completed trips yet. Add items from Master List for this shop.");
    }
  }catch(err){
    console.error("Start new trip error:",err);
    setSyncStatus("Sync error");
    alert(`Could not build your new shop.\n\n${err?.message||String(err)}`);
  }
}

async function verifyCloudMatchesLocal(){
  const remote=await fetchRemoteState();
  const storeNames=new Set(remote.stores.map(x=>x.name.toLowerCase()));
  const itemNames=new Set(remote.items.map(x=>x.name.toLowerCase()));
  for(const st of state.stores)if(!storeNames.has(st.toLowerCase()))throw new Error('Migration verification failed: missing store '+st);
  for(const it of state.items)if(!itemNames.has(it.name.toLowerCase()))throw new Error('Migration verification failed: missing item '+it.name);
  const remotePairs={};for(const row of remote.pairs){remotePairs[row.store_name+'|'+row.item_a_name+'|'+row.item_b_name]=Number(row.observations||0);}
  for(const [store,stats] of Object.entries(state.orderStatsByStore||{}))for(const [key,count] of Object.entries(stats||{})){const [a,b]=key.split('|');const actual=remotePairs[store+'|'+a+'|'+b]||0;if(actual!==Number(count))throw new Error('Migration verification failed: route history mismatch');}

  return remote;
}
async function seedRemoteFromLocal(){

async function loadCloudOrMigrate(){
  await ensureProfile();
  const uid=currentUser.id;
  const remote=await fetchRemoteState();

  // Existing signed-in accounts are cloud-authoritative. This is critical for
  // secondary devices (especially the iPhone): stale local data must never be
  // offered as a migration that can overwrite the current desktop/cloud data.
  if(remoteHasData(remote)){
    deviceLocalDataAvailable=false;
    await downloadIntoLocal(remote);
    markMigrationCompleted(uid);
    setCloudSnapshotSignature(uid,state);
    localDirty=false;
    setSyncStatus('Synced');
    return;
  }

  // Only a genuinely new/empty cloud account may be seeded from this device.
  const localHasData=localHasAnythingBeyondFresh() || hasLocalCustomData();
  deviceLocalDataAvailable=localHasData;
  if(localHasData){
    await seedRemoteFromLocal();
    return;
  }

  await seedRemoteFromLocal();
}
async function downloadIntoLocal(remote){
  const uid=currentUser.id; const catById=Object.fromEntries(remote.categories.map(x=>[x.id,x.name])); const storeById=Object.fromEntries(remote.stores.map(x=>[x.id,x.name]));
  state.categories=[];
  state.stores=remote.stores.length?remote.stores.sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.name):[];
    const fallbackStore=state.stores[0]||"";
  state.items=(remote.items||[]).sort((a,b)=>a.sort_order-b.sort_order).map(x=>({id:x.name,name:x.name,category:"",store:storeById[x.default_store_id]||fallbackStore,shopStore:storeById[x.default_store_id]||fallbackStore,usualQty:String(x.usual_quantity??1),usualUnit:x.usual_unit||"each",shopQty:String(x.usual_quantity??1),shopUnit:x.usual_unit||"each",selected:false,bought:false,newTripMode:x.new_trip_mode||"auto",updatedAt:x.updated_at||null}));
  // Restore the most recent genuinely active open shopping trip, if there is one.
  // A stale open trip can remain briefly around completion because another sync may
  // have written it before the final Bought tap. Never resurrect a trip whose
  // items are already all bought; completion has already cleared it locally.
  const openTrip=(remote.trips||[]).find(t=>t.status==="open");
  if(openTrip){
    const {data:tripItems,error}=await db.from("shopping_trip_items")
      .select("item_name,quantity,unit,store_name,bought,route_position")
      .eq("trip_id",openTrip.id).eq("user_id",uid);
    if(error)throw error;
    const rows=tripItems||[];
    const hasUnbought=rows.some(row=>!row.bought);
    if(hasUnbought){
      for(const row of rows){
        const x=state.items.find(i=>i.name===row.item_name);
        if(x){x.selected=true;x.bought=!!row.bought;x.shopQty=String(row.quantity);x.shopUnit=row.unit||x.shopUnit;x.shopStore=row.store_name||x.shopStore}
      }
    }else{
      // Defensive cleanup: an open trip with no remaining items is stale and must
      // never be allowed to repopulate This Week on another device.
      const delItems=await db.from("shopping_trip_items").delete().eq("trip_id",openTrip.id).eq("user_id",uid);
      if(delItems.error)throw delItems.error;
      const delTrip=await db.from("shopping_trips").delete().eq("id",openTrip.id).eq("user_id",uid);
      if(delTrip.error)throw delTrip.error;
    }
  }
  state.orderStatsByStore={};for(const row of remote.pairs){state.orderStatsByStore[row.store_name]??={};state.orderStatsByStore[row.store_name][row.item_a_name+"|"+row.item_b_name]=row.observations}
  state.lastRoutesByStore={};for(const row of remote.routes)state.lastRoutesByStore[row.store_name]=Array.isArray(row.route_items)?row.route_items:[];
  state.routesByStore={};state.pairsByStore={};state.route=[];state.pairs={};state.shopStarted=null;
  normalizeState();saveLocal();localDirty=false;
  setCloudSnapshotSignature(uid,state);
}
async function ensureProfile(){

  const uid=currentUser.id;
  const {error}=await db.from("profiles").upsert({
    id:uid,
    display_name:currentUser.email||"",

  },{onConflict:"id"});

async function fetchRemoteState(){
  if(!currentUser) throw new Error("No authenticated user");
  const uid=currentUser.id;
  const run=()=>Promise.all([
    db.from("categories").select("id,name,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("stores").select("id,name,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("master_items").select("id,name,category_id,default_store_id,usual_quantity,usual_unit,new_trip_mode,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("shopping_trips").select("id,status,started_at,completed_at,created_at,updated_at").eq("user_id",uid).order("created_at",{ascending:false}),
    db.from("route_pairs").select("id,store_name,item_a_name,item_b_name,observations,last_observed_at").eq("user_id",uid),
    db.from("latest_store_routes").select("id,store_name,trip_id,route_items,completed_at").eq("user_id",uid)
  ]);
  let result;
  for(let attempt=0;attempt<3;attempt++){
    result=await run();
    const err=result.find(r=>r.error)?.error;
    if(!err)break;
    const futureJwt=err.code==="PGRST303"||/JWT issued at future/i.test(err.message||"");
    if(!futureJwt||attempt===2)throw err;
    await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));
  }
  const [cats,stores,items,trips,pairs,routes]=result;
  for(const response of [cats,stores,items,trips,pairs,routes]) if(response.error) throw response.error;
  return {
    categories:cats.data||[],
    stores:stores.data||[],
    items:items.data||[],
    trips:trips.data||[],
    pairs:pairs.data||[],
    routes:routes.data||[]
  };
}

async function syncOpenTrip(){

      const drop=await db.from("shopping_trips").delete().eq("id",existing[0].id).eq("user_id",uid);if(drop.error)throw drop.error;
    }

  }

    if(ins.error)throw ins.error;

}
async function syncCompletedTrip(completed){
  if(!currentUser){completionInProgress=false;return;}
  // Wait for any ordinary sync that was already in flight when the final item
  // was bought. New ordinary syncs are blocked by completionInProgress.
  while(syncing){await new Promise(resolve=>setTimeout(resolve,100));}
  setSyncStatus("Saving completed shop…");
  try{
    const uid=currentUser.id;
    const now=new Date().toISOString();
  
    // Completion is authoritative. Never depend on the open-trip record still
    // existing because a queued/background sync may concurrently clear it.
    // Create a dedicated completed trip first, then write its route rows.
    const ins=await db.from("shopping_trips").insert({user_id:uid,status:"completed",started_at:now,completed_at:now,updated_at:now}).select("id").single();
    if(ins.error)throw ins.error;
    const tripId=ins.data.id;
  
    const routeRows=[];
    for(const [store,rawRoute] of Object.entries(completed)){
      const route=[...new Set((rawRoute||[]).filter(Boolean))];
      for(let i=0;i<route.length;i++)routeRows.push({trip_id:tripId,user_id:uid,item_name:state.items.find(x=>x.id===route[i])?.name||route[i],quantity:1,unit:"each",store_name:store,bought:true,bought_at:now,route_position:i+1});
  }
    if(!routeRows.length)throw new Error("Cannot complete an empty shopping trip.");
    const rowsIns=await db.from("shopping_trip_items").insert(routeRows);
    if(rowsIns.error)throw rowsIns.error;
  
    // Clean up any stale open trip left behind by the normal selection sync.
    const openRows=await db.from("shopping_trips").select("id").eq("user_id",uid).eq("status","open");
    if(openRows.error)throw openRows.error;
    const openIds=(openRows.data||[]).map(r=>r.id).filter(Boolean);
    if(openIds.length){
      const di=await db.from("shopping_trip_items").delete().eq("user_id",uid).in("trip_id",openIds);if(di.error)throw di.error;
      const dt=await db.from("shopping_trips").delete().eq("user_id",uid).in("id",openIds);if(dt.error)throw dt.error;
  }
  
    await replaceCloudRoutes();
    setSyncStatus("Synced");
  } finally {
    completionInProgress=false;
  }
}

async function replaceCloudRoutes(){
  const uid=currentUser.id;

  // The authoritative route history is the completed shopping trips in the
  // cloud, not a single device's local route state. Rebuild the aggregate route
  // tables from every completed trip so one device can never overwrite another
  // device's learning history.
  const tripsRes=await db.from("shopping_trips")
    .select("id,completed_at,created_at")
    .eq("user_id",uid)
    .eq("status","completed")
    .order("completed_at",{ascending:true});
  if(tripsRes.error)throw tripsRes.error;
  const tripRows=tripsRes.data||[];
  const tripIds=tripRows.map(t=>t.id).filter(Boolean);

  let itemRows=[];
  if(tripIds.length){
    const itemsRes=await db.from("shopping_trip_items")
      .select("trip_id,item_name,store_name,route_position")
      .eq("user_id",uid)
      .in("trip_id",tripIds)
      .not("route_position","is",null)
      .order("route_position",{ascending:true});
    if(itemsRes.error)throw itemsRes.error;
    itemRows=itemsRes.data||[];
  }

  const tripMap=new Map(tripRows.map(t=>[t.id,t]));
  const byTripStore=new Map();
  for(const row of itemRows){
    const store=(row.store_name||"Pak N Save").trim()||"Pak N Save";
    const key=row.trip_id+"||"+store;
    if(!byTripStore.has(key))byTripStore.set(key,[]);
    byTripStore.get(key).push(row);
  }

  const aggregate={};
  const latest={};
  for(const [key,rows] of byTripStore.entries()){
    rows.sort((a,b)=>Number(a.route_position)-Number(b.route_position));
    const [tripId,store]=key.split("||");
    const route=[...new Set(rows.map(r=>r.item_name).filter(Boolean))];

    aggregate[store]??={};
    for(let i=0;i<route.length;i++){
      for(let j=i+1;j<route.length;j++){
        if(route[i]===route[j])continue;
        const pair=route[i]+"|"+route[j];
        aggregate[store][pair]=(aggregate[store][pair]||0)+1;
      }
    }

    const trip=tripMap.get(tripId);
    const tripTime=trip?.completed_at||trip?.created_at||new Date().toISOString();
    if(!latest[store] || new Date(tripTime)>new Date(latest[store].completed_at)){
      latest[store]={route,tripId,completed_at:tripTime};
    }
  }

  const delPairs=await db.from("route_pairs").delete().eq("user_id",uid);
  if(delPairs.error)throw delPairs.error;
  const pairRows=[];
  for(const [store,stats] of Object.entries(aggregate)){
    for(const [key,count] of Object.entries(stats)){
      const split=key.indexOf("|");
      if(split<0)continue;
      const a=key.slice(0,split),b=key.slice(split+1);
      pairRows.push({user_id:uid,store_name:store,item_a_name:a,item_b_name:b,observations:count,last_observed_at:new Date().toISOString()});
    }
  }
  if(pairRows.length){
    const ins=await db.from("route_pairs").insert(pairRows);
    if(ins.error)throw ins.error;
  }

  const delLatest=await db.from("latest_store_routes").delete().eq("user_id",uid);
  if(delLatest.error)throw delLatest.error;
  const latestRows=Object.entries(latest).map(([store,data])=>({
    user_id:uid,
    store_name:store,
    trip_id:data.tripId,
    route_items:data.route,
    completed_at:data.completed_at
  }));
  if(latestRows.length){
    const ins=await db.from("latest_store_routes").insert(latestRows);
    if(ins.error)throw ins.error;
  }

  // Keep the current device's in-memory route learning aligned with the cloud
  // aggregates after rebuilding from all completed trips.
  state.orderStatsByStore={};
  for(const [store,stats] of Object.entries(aggregate))state.orderStatsByStore[store]={...stats};
  state.lastRoutesByStore={};
  for(const [store,data] of Object.entries(latest))state.lastRoutesByStore[store]=[...data.route];
  saveLocal();
}
async function syncMasterData(){
  const uid=currentUser.id;
  const stores=state.stores.map((name,i)=>({user_id:uid,name,sort_order:i}));
  let r=await db.from("stores").upsert(stores,{onConflict:"user_id,name"});
  if(r.error)throw r.error;

  const {data:stores2,error:se}=await db.from("stores").select("id,name").eq("user_id",uid);
  if(se)throw se;
  const safeStores=Array.isArray(stores2)?stores2:[];
  const storeMap=Object.fromEntries(safeStores.map(x=>[String(x.name||"").trim().toLowerCase(),x.id]));

  // Master List item sync is item-aware. A device may be behind another device,
  // so never let an older local copy overwrite a newer cloud item.
  const remoteRes=await db.from("master_items")
    .select("id,name,default_store_id,usual_quantity,usual_unit,new_trip_mode,sort_order,updated_at")
    .eq("user_id",uid);
  if(remoteRes.error)throw remoteRes.error;
  const remoteByName=new Map((remoteRes.data||[]).map(row=>[String(row.name||"").trim().toLowerCase(),row]));

  const candidateRows=state.items.map((x,i)=>({
    user_id:uid,
    name:x.name,
    category_id:null,
    default_store_id:storeMap[String(x.store||"").trim().toLowerCase()]||null,
    usual_quantity:Number(x.usualQty)||1,
    usual_unit:x.usualUnit||"each",
    new_trip_mode:["auto","always","never"].includes(x.newTripMode)?x.newTripMode:"auto",
    sort_order:i,
    updated_at:x.updatedAt||null
  }));
  const unresolved=candidateRows.filter(row=>!row.default_store_id);
  if(unresolved.length)throw new Error(`One or more items are missing a valid default store: ${unresolved.map(r=>r.name).join(", ")}`);

  const rowsToUpsert=[];
  for(const row of candidateRows){
    const key=String(row.name).trim().toLowerCase();
    const remote=remoteByName.get(key);
    if(!remote){
      rowsToUpsert.push({...row,updated_at:row.updated_at||new Date().toISOString()});
      const local=state.items.find(x=>String(x.name).trim().toLowerCase()===key);
      if(local&&!local.updatedAt)local.updatedAt=rowsToUpsert[rowsToUpsert.length-1].updated_at;
      continue;
    }
    const localTs=row.updated_at?new Date(row.updated_at).getTime():0;
    const remoteTs=remote.updated_at?new Date(remote.updated_at).getTime():0;
    // Only write when the local item is newer, or when the remote record is legacy
    // and has no timestamp. Equal/older local state is left untouched in the cloud.
    if(localTs>remoteTs || (remoteTs===0 && localTs>0))rowsToUpsert.push(row);
  }

  if(rowsToUpsert.length){
    r=await db.from("master_items").upsert(rowsToUpsert,{onConflict:"user_id,name"});
    if(r.error)throw r.error;
  }

  // Refresh the remote index after writes so the deletion check never treats a
  // newer cloud-created item as stale merely because this device has not pulled it yet.
  const {data:ritems,error:ri}=await db.from("master_items").select("id,name,updated_at").eq("user_id",uid);
  if(ri)throw ri;
  // Deliberate item deletion is still handled by deleteItem(), which performs the
  // cloud deletion directly. Therefore normal sync must not delete any remote item.
  // This prevents a stale device from deleting a newly-added item.

  await syncOpenTrip();
}

async function syncToCloud(forceRoutes=false){if(!currentUser||!cloudReady||syncing||completionInProgress)return false;syncing=true;try{setSyncStatus("Syncing…");await syncMasterData();if(forceRoutes)await replaceCloudRoutes();localDirty=false;setCloudSnapshotSignature(currentUser.id,state);deviceLocalDataAvailable=false;setSyncStatus("Synced");return true}catch(err){console.error(err);setSyncStatus("Sync error");return false}finally{syncing=false}}
async function syncNow(){
  if(!currentUser||!cloudReady||syncing)return;
  syncing=true;
  const btn=document.getElementById("syncNowBtn");
  if(btn)btn.disabled=true;
  try{
    setSyncStatus("Syncing…");
    // Never discard unsaved local changes. Push them first, then pull the
    // authoritative cloud state back down so both devices converge.
    if(localDirty){
      await syncMasterData();
      await replaceCloudRoutes();
      localDirty=false;
    }
    const remote=await fetchRemoteState();
    await downloadIntoLocal(remote);
    setCloudSnapshotSignature(currentUser.id,state);
    deviceLocalDataAvailable=false;
    setSyncStatus("Synced");
    render();
  }catch(err){
    console.error("Manual sync error:",err);
    setSyncStatus("Sync error");
    alert(`Sync failed.\n\n${err?.message||String(err)}`);
  }finally{
    syncing=false;
    if(btn)btn.disabled=false;
  }
}
function queueCloudSync(forceRoutes=false){if(!currentUser||!cloudReady)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>syncToCloud(forceRoutes),400)}

async function signIn(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||!password){setAuthMsg("Enter your email and password.");return}setAuthMsg("Signing in…",false);const {error}=await db.auth.signInWithPassword({email,password});if(error){setAuthMsg(error.message);return}setAuthMsg("Sign-in successful. Loading your Shop Path…",false)}
async function signUp(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||!password){setAuthMsg("Enter your email and password.");return}setAuthMsg("Creating account…",false);const {data,error}=await db.auth.signUp({email,password});if(error){setAuthMsg(error.message);return}if(data.session){setAuthMsg("Account created. Loading your Shop Path…",false)}else setAuthMsg("Account created. Check your email to confirm your account, then sign in.",false)}
async function resetPassword(){const email=document.getElementById("authEmail").value.trim();if(!email){setAuthMsg("Enter your email address first.");return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});setAuthMsg(error?error.message:"If that email has an account, Supabase will send password-reset instructions.",!error)}
async function bootAuthenticated(user){
  currentUser=user;loadLocal();document.getElementById("userEmail").textContent=user.email||"";authVisible(false);setAuthMsg("");setSyncStatus("Connecting…");
  try{await loadCloudOrMigrate();cloudReady=true;render();}catch(err){console.error("Supabase boot error:",err);cloudReady=false;setSyncStatus("Cloud setup needed");render();const code=err?.code?` [${err.code}]`:"";const msg=err?.message||String(err);alert(`Shop Path could not complete cloud setup.${code}\n\n${msg}`)}
}
async function signOut(){await db.auth.signOut();currentUser=null;cloudReady=false;authVisible(true);setAuthMsg("Signed out.",false)}

document.getElementById("signInBtn").onclick=()=>signIn();document.getElementById("signUpBtn").onclick=()=>signUp();document.getElementById("resetBtn").onclick=()=>resetPassword();document.getElementById("signOutBtn").onclick=()=>signOut();document.getElementById("syncNowBtn").onclick=()=>syncNow();
["authEmail","authPassword"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")signIn()}));
document.getElementById("tabShop").onclick=()=>{view="shop";setTabs();render()};document.getElementById("tabMaster").onclick=()=>{view="master";setTabs();render()};document.getElementById("tabRoute").onclick=()=>{view="route";setTabs();render()};
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById(view==="master"?"tabMaster":view==="route"?"tabRoute":"tabShop").classList.add("active")}

db.auth.onAuthStateChange(async (_event,session)=>{if(session&&!currentUser){try{await bootAuthenticated(session.user)}catch(e){console.error(e)}}else if(!session&&currentUser){currentUser=null;cloudReady=false;authVisible(true)}});
(async()=>{const {data}=await db.auth.getSession();if(data.session)await bootAuthenticated(data.session.user);else{loadLocal();authVisible(true)}})();
</script>
