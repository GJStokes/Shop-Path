function pairwiseLearningScore(id,store,selectedIds){
  const stats=state.orderStatsByStore[store]||{};
  // Rank by pairwise majority wins rather than raw summed margins.
  // This makes repeated ordering behaviour easier to interpret: if an item
  // has been observed before another item more often than the reverse, it
  // wins that comparison. Total wins determine the primary rank, with total
  // winning margin as a secondary confidence signal.
  let wins=0, margin=0;
  for(const other of selectedIds){
    if(other===id)continue;
    const forward=Number(stats[id+"|"+other]||0);
    const reverse=Number(stats[other+"|"+id]||0);
    if(forward>reverse)wins++;
    else if(forward===reverse && forward>0){}
    margin += forward-reverse;
  }
  return {wins,margin};
}
function compareLearnedItems(a,b,store,lastPos,selectedIds){
  const as=pairwiseLearningScore(a.id,store,selectedIds);
  const bs=pairwiseLearningScore(b.id,store,selectedIds);
  if(as.wins!==bs.wins)return bs.wins-as.wins;
  if(as.margin!==bs.margin)return bs.margin-as.margin;
  const ap=lastPos.has(a.id)?lastPos.get(a.id):Infinity;
  const bp=lastPos.has(b.id)?lastPos.get(b.id):Infinity;
  if(ap!==bp)return ap-bp;
  return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});
}
function sortedSelectedByStore(store){

  const lastPos=new Map(learned.map((id,i)=>[id,i])); const ids=selected.map(x=>x.id);
  return selected.sort((a,b)=>compareLearnedItems(a,b,store,lastPos,ids));
}

async function clearRoute(){
  if(!confirm("Clear all learned route history for every store? Your Master List and current weekly shop will not be changed."))return;
  // Clear route-learning data locally while leaving Master List, stores, categories
  // and the current weekly shopping selection untouched.
  state.routesByStore={};
  state.pairsByStore={};
  state.orderStatsByStore={};
  state.lastRoutesByStore={};
  saveLocal();
  render();
  if(currentUser && cloudReady){
    setSyncStatus("Clearing learned routes…");
    try{
      const uid=currentUser.id;
      // Route learning is derived from completed shopping trips. Remove those
      // completed trip records too, otherwise a later rebuild could resurrect
      // routes the user explicitly asked to clear. Leave any open/current trip alone.
      const done=await db.from("shopping_trips").select("id").eq("user_id",uid).eq("status","completed");
      if(done.error)throw done.error;
      const completedIds=(done.data||[]).map(r=>r.id).filter(Boolean);
      if(completedIds.length){
        const di=await db.from("shopping_trip_items").delete().in("trip_id",completedIds).eq("user_id",uid);
        if(di.error)throw di.error;
        const dt=await db.from("shopping_trips").delete().in("id",completedIds).eq("user_id",uid);
        if(dt.error)throw dt.error;
      }
      const [pairs,routes]=await Promise.all([
        db.from("route_pairs").delete().eq("user_id",uid),
        db.from("latest_store_routes").delete().eq("user_id",uid)
      ]);
      if(pairs.error)throw pairs.error;
      if(routes.error)throw routes.error;
      setSyncStatus("Synced");
    }catch(err){
      console.error("Clear learned routes error:",err);
      setSyncStatus("Sync error");
      alert("The local learned routes were cleared, but the cloud could not be updated. Please try again.");
    }
  }
}

}

async function deleteItem(id){

      else if(map[store]&&typeof map[store]==='object'){
        const next={};

          if(parts[0]===id||parts[0]===x.name||parts[1]===id||parts[1]===x.name)continue;
          next[k]=v;
        }
        map[store]=next;
      }
    }

      const res=await db.from("master_items").delete().eq("user_id",currentUser.id).eq("name",x.name);

    render();

    state=oldState;
    saveLocal();
    render();
    alert(`Could not delete "${x.name}" from the cloud. The item has been restored.\n\n${err?.message||String(err)}`);
    setSyncStatus("Sync error");
  }

function localHasAnythingBeyondFresh(){
  if(!state)return false;
  const fresh=freshState();
  return JSON.stringify(state)!==JSON.stringify(fresh);
}
function mergeUniqueNames(primary,secondary){
  const out=[]; const seen=new Set();
  for(const name of [...(primary||[]),...(secondary||[])]){const n=String(name||'').trim();const key=n.toLowerCase();if(n&&!seen.has(key)){seen.add(key);out.push(n);}}
  return out;
}
function mergeLocalIntoCurrent(localSnapshot){
  const remoteState=cloneState(state);
  const localState=cloneState(localSnapshot);
  // Keep everything that exists in either source. Local data wins on same-item conflicts,
  // because this migration is specifically protecting the existing device data.
  state.categories=mergeUniqueNames(remoteState.categories,localState.categories);
  state.stores=mergeUniqueNames(remoteState.stores,localState.stores);
  const byName=new Map();
  for(const item of remoteState.items||[])byName.set(String(item.name).toLowerCase(),cloneState(item));
  for(const item of localState.items||[])byName.set(String(item.name).toLowerCase(),cloneState(item));
  state.items=[...byName.values()];
  state.items.forEach(x=>{
    if(!x.store)x.store="PAK'nSAVE";
    if(!x.shopStore)x.shopStore=x.store;
    if(x.usualQty==null)x.usualQty='1'; if(!x.usualUnit)x.usualUnit='each';
    if(x.shopQty==null)x.shopQty=x.usualQty; if(!x.shopUnit)x.shopUnit=x.usualUnit;
    if(x.selected==null)x.selected=false; if(x.bought==null)x.bought=false;
  });
  const mergedStats={};
  for(const source of [remoteState.orderStatsByStore,localState.orderStatsByStore]){
    for(const [store,stats] of Object.entries(source||{})){mergedStats[store]??={};for(const [key,count] of Object.entries(stats||{})){mergedStats[store][key]=(mergedStats[store][key]||0)+Number(count||0);}}
  }
  state.orderStatsByStore=mergedStats;
  const mergeObjectArrays=(a,b)=>{const out={};for(const src of [a,b])for(const [store,arr] of Object.entries(src||{})){if(Array.isArray(arr)&&arr.length)out[store]=cloneState(arr);}return out;};
  state.lastRoutesByStore=mergeObjectArrays(remoteState.lastRoutesByStore,localState.lastRoutesByStore);
  state.routesByStore=mergeObjectArrays(remoteState.routesByStore,localState.routesByStore);
  const mergedPairs={};
  for(const source of [remoteState.pairsByStore,localState.pairsByStore])for(const [store,pairs] of Object.entries(source||{})){mergedPairs[store]??={};for(const [key,count] of Object.entries(pairs||{}))mergedPairs[store][key]=Math.max(Number(mergedPairs[store][key]||0),Number(count||0));}
  state.pairsByStore=mergedPairs;
  state.route=localState.route?.length?cloneState(localState.route):cloneState(remoteState.route||[]);
  state.pairs=localState.pairs&&Object.keys(localState.pairs).length?cloneState(localState.pairs):cloneState(remoteState.pairs||{});
  state.shopStarted=localState.shopStarted||remoteState.shopStarted||null;
  // For the current week's selection, preserve local choices but don't throw away
  // an open cloud shopping trip that the other device may already have.
  const remoteByName=Object.fromEntries((remoteState.items||[]).map(x=>[String(x.name).toLowerCase(),x]));
  state.items.forEach(x=>{
    const local=localState.items?.find(i=>String(i.name).toLowerCase()===String(x.name).toLowerCase());
    const remote=remoteByName[String(x.name).toLowerCase()];
    if(local?.selected){x.selected=true;x.bought=!!local.bought;x.shopQty=local.shopQty||x.shopQty;x.shopUnit=local.shopUnit||x.shopUnit;x.shopStore=local.shopStore||x.shopStore;}
    else if(remote?.selected){x.selected=true;x.bought=!!remote.bought;x.shopQty=remote.shopQty||x.shopQty;x.shopUnit=remote.shopUnit||x.shopUnit;x.shopStore=remote.shopStore||x.shopStore;}
  });
  normalizeState();
}
async function verifyCloudMatchesLocal(){
  const remote=await fetchRemoteState();
  const catNames=new Set(remote.categories.map(x=>x.name.toLowerCase()));
  const storeNames=new Set(remote.stores.map(x=>x.name.toLowerCase()));
  const itemNames=new Set(remote.items.map(x=>x.name.toLowerCase()));
  for(const c of state.categories)if(!catNames.has(c.toLowerCase()))throw new Error('Migration verification failed: missing category '+c);
  for(const st of state.stores)if(!storeNames.has(st.toLowerCase()))throw new Error('Migration verification failed: missing store '+st);
  for(const it of state.items)if(!itemNames.has(it.name.toLowerCase()))throw new Error('Migration verification failed: missing item '+it.name);
  const remotePairs={};for(const row of remote.pairs){remotePairs[row.store_name+'|'+row.item_a_name+'|'+row.item_b_name]=Number(row.observations||0);}
  for(const [store,stats] of Object.entries(state.orderStatsByStore||{}))for(const [key,count] of Object.entries(stats||{})){const [a,b]=key.split('|');const actual=remotePairs[store+'|'+a+'|'+b]||0;if(actual!==Number(count))throw new Error('Migration verification failed: route history mismatch');}
  for(const [store,route] of Object.entries(state.lastRoutesByStore||{})){const actual=remote.routes.find(r=>r.store_name===store)?.route_items||[];if(JSON.stringify(actual)!==JSON.stringify(route))throw new Error('Migration verification failed: latest route mismatch for '+store);}
  return remote;
}
async function seedRemoteFromLocal(){
  setSyncStatus('Migrating local data…');
  const uid=currentUser.id;
  backupLocalBeforeMigration(uid);
  // Write all local master data and route history. The caller only uses this when the
  // remote account is empty, so nothing existing in the cloud is overwritten.
  await syncMasterData();
  await replaceCloudRoutes();
  await verifyCloudMatchesLocal();
  markMigrationCompleted(uid);
  localDirty=false;
  setSyncStatus('Migration complete');
}
async function migrateOrMergeLocalData(remote){
  const uid=currentUser.id;
  backupLocalBeforeMigration(uid);
  const localSnapshot=cloneState(state);
  if(remoteHasData(remote)){
    await downloadIntoLocal(remote);
    mergeLocalIntoCurrent(localSnapshot);
  }
  await syncMasterData();
  await replaceCloudRoutes();
  await verifyCloudMatchesLocal();
  markMigrationCompleted(uid);
  saveLocal();
  localDirty=false;
  setCloudSnapshotSignature(uid,state);
  deviceLocalDataAvailable=false;
  setSyncStatus('Migration complete');
}
async function recoverMigrationBackup(remote){
  if(!currentUser)return;
  const uid=currentUser.id;
  const backup=getMigrationBackup(uid);
  if(!backup)throw new Error('No device migration backup was found.');
  backupLocalBeforeMigration(uid);
  await downloadIntoLocal(remote);
  mergeLocalIntoCurrent(backup);
  await syncMasterData();
  await replaceCloudRoutes();
  await verifyCloudMatchesLocal();
  markMigrationCompleted(uid);
  saveLocal();
  localDirty=false;
  setSyncStatus('Migration complete');
}

async function migrateNow(){
  if(!currentUser)return;
  try{
    setSyncStatus("Preparing migration…");
    const remote=await fetchRemoteState();
    if(remoteHasData(remote)){
      const ok=confirm("Your cloud account already has data. I will back up this device first, then merge this Mac's data into the cloud without deleting the device data. Continue?");
      if(!ok){setSyncStatus("Migration cancelled");return;}
      await migrateOrMergeLocalData(remote);
    }else{
      await seedRemoteFromLocal();

async function loadCloudOrMigrate(){
  await ensureProfile();
  const uid=currentUser.id;
  const localBeforeCloud=cloneState(state);
  const hasMeaningfulLocalData=localHasAnythingBeyondFresh() || hasLocalCustomData();
  const remote=await fetchRemoteState();
  // A previous migration attempt may have backed up the device data before a later
  // step failed. Recover that backup before allowing the cloud copy to replace it.
  if(!hasMigrationCompleted(uid)){
    const sameUserBackup=getMigrationBackup(uid);
    const anyBackup=findAnyMigrationBackup();
    const backup=sameUserBackup || (anyBackup&&anyBackup.state);
    if(backup&&hasCustomDataInSnapshot(backup)){
      const ok=confirm('A protected backup of your previous device data was found. It contains custom Shop Path data such as your Pet category, added items and/or route history. I will merge that backup with the cloud data without deleting either side. Continue?');
      if(ok){
        if(sameUserBackup) await recoverMigrationBackup(remote);
        else {
          await downloadIntoLocal(remote);
          mergeLocalIntoCurrent(backup);
          await syncMasterData();
          await replaceCloudRoutes();
          await verifyCloudMatchesLocal();
          markMigrationCompleted(uid);
          saveLocal();
          localDirty=false;
          setCloudSnapshotSignature(uid,state);
          deviceLocalDataAvailable=false;
          setSyncStatus('Migration complete');
        }
        return;
      }
      setSyncStatus('Migration available');
      return;
    }
  }
  if(hasMigrationCompleted(uid)){
    deviceLocalDataAvailable=false;
    // A completed migration means the local device has already been merged into
    // the account. From this point forward the cloud copy is the shared source of
    // truth for this signed-in device.
    await downloadIntoLocal(remote);
    setSyncStatus('Synced');
    return;
  }
  const localHasData=hasMeaningfulLocalData && !localMatchesLastCloud(uid,localBeforeCloud);
  deviceLocalDataAvailable=localHasData;
  if(!remoteHasData(remote)){
    if(localHasData){
      const doMigrate=confirm('Your existing Shop Path data is on this device. A secure local backup will be created before it is copied to the cloud. Continue with migration?');
      if(doMigrate){await seedRemoteFromLocal();return}
      throw new Error('Migration cancelled. Your local data has not been changed.');
    }
    await seedRemoteFromLocal();
    return;
  }
  if(localHasData){
    const doMerge=confirm('This device has existing Shop Path data and your cloud account also has data. I will back up the device data first, then safely merge both sets of data without deleting either side. Continue?');
    if(doMerge){await migrateOrMergeLocalData(remote);return}
    await downloadIntoLocal(remote);
    return;
  }
  await downloadIntoLocal(remote);
  setSyncStatus('Synced');
}
async function downloadIntoLocal(remote){
  const uid=currentUser.id; const catById=Object.fromEntries(remote.categories.map(x=>[x.id,x.name])); const storeById=Object.fromEntries(remote.stores.map(x=>[x.id,x.name]));
  state.categories=remote.categories.length?remote.categories.sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.name):[...CATEGORIES];
  state.stores=remote.stores.length?remote.stores.sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.name):[...DEFAULT_STORES];
  state.items=(remote.items||[]).sort((a,b)=>a.sort_order-b.sort_order).map(x=>({id:x.name,name:x.name,category:catById[x.category_id]||"Other",store:storeById[x.default_store_id]||"PAK'nSAVE",shopStore:storeById[x.default_store_id]||"PAK'nSAVE",usualQty:String(x.usual_quantity??1),usualUnit:x.usual_unit||"each",shopQty:String(x.usual_quantity??1),shopUnit:x.usual_unit||"each",selected:false,bought:false}));

  const openTrip=(remote.trips||[]).find(t=>t.status==="open");
  if(openTrip){const {data:tripItems,error}=await db.from("shopping_trip_items").select("item_name,quantity,unit,store_name,bought,route_position").eq("trip_id",openTrip.id).eq("user_id",uid);if(error)throw error;for(const row of (tripItems||[])){const x=state.items.find(i=>i.name===row.item_name);if(x){x.selected=true;x.bought=!!row.bought;x.shopQty=String(row.quantity);x.shopUnit=row.unit||x.shopUnit;x.shopStore=row.store_name||x.store}}}
  state.orderStatsByStore={};for(const row of remote.pairs){state.orderStatsByStore[row.store_name]??={};state.orderStatsByStore[row.store_name][row.item_a_name+"|"+row.item_b_name]=row.observations}
  state.lastRoutesByStore={};for(const row of remote.routes)state.lastRoutesByStore[row.store_name]=Array.isArray(row.route_items)?row.route_items:[];
  state.routesByStore={};state.pairsByStore={};state.route=[];state.pairs={};state.shopStarted=null;
  normalizeState();saveLocal();localDirty=false;
  setCloudSnapshotSignature(uid,state);
}
async function ensureProfile(){
  if(!currentUser) throw new Error("No authenticated user");
  const uid=currentUser.id;
  const {error}=await db.from("profiles").upsert({
    id:uid,
    display_name:currentUser.email||"",
    updated_at:new Date().toISOString()
  },{onConflict:"id"});
  if(error) throw error;
}

async function fetchRemoteState(){
  if(!currentUser) throw new Error("No authenticated user");
  const uid=currentUser.id;
  const [cats,stores,items,trips,pairs,routes]=await Promise.all([
    db.from("categories").select("id,name,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("stores").select("id,name,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("master_items").select("id,name,category_id,default_store_id,usual_quantity,usual_unit,sort_order").eq("user_id",uid).order("sort_order",{ascending:true}),
    db.from("shopping_trips").select("id,status,started_at,completed_at,created_at,updated_at").eq("user_id",uid).order("created_at",{ascending:false}),
    db.from("route_pairs").select("id,store_name,item_a_name,item_b_name,observations,last_observed_at").eq("user_id",uid),
    db.from("latest_store_routes").select("id,store_name,trip_id,route_items,completed_at").eq("user_id",uid)
  ]);
  for(const result of [cats,stores,items,trips,pairs,routes]) if(result.error) throw result.error;
  return {
    categories:cats.data||[],
    stores:stores.data||[],
    items:items.data||[],
    trips:trips.data||[],
    pairs:pairs.data||[],
    routes:routes.data||[]
  };
}

  const uid=currentUser.id; const {data:open,error:e}=await db.from("shopping_trips").select("id,started_at").eq("user_id",uid).eq("status","open").order("created_at",{ascending:false}).limit(1);if(e)throw e;

async function replaceCloudRoutes(){
  const uid=currentUser.id;

  // The authoritative route history is the completed shopping trips in the
  // cloud, not a single device's local route state. Rebuild the aggregate route
  // tables from every completed trip so one device can never overwrite another
  // device's learning history.
  const tripsRes=await db.from("shopping_trips")
    .select("id,completed_at,created_at")
    .eq("user_id",uid)
    .eq("status","completed")
    .order("completed_at",{ascending:true});
  if(tripsRes.error)throw tripsRes.error;
  const tripRows=tripsRes.data||[];
  const tripIds=tripRows.map(t=>t.id).filter(Boolean);

  let itemRows=[];
  if(tripIds.length){
    const itemsRes=await db.from("shopping_trip_items")
      .select("trip_id,item_name,store_name,route_position")
      .eq("user_id",uid)
      .in("trip_id",tripIds)
      .not("route_position","is",null)
      .order("route_position",{ascending:true});
    if(itemsRes.error)throw itemsRes.error;
    itemRows=itemsRes.data||[];
  }

  const tripMap=new Map(tripRows.map(t=>[t.id,t]));
  const byTripStore=new Map();
  for(const row of itemRows){
    const store=(row.store_name||"PAK'nSAVE").trim()||"PAK'nSAVE";
    const key=row.trip_id+"||"+store;
    if(!byTripStore.has(key))byTripStore.set(key,[]);
    byTripStore.get(key).push(row);
  }

  const aggregate={};
  const latest={};
  for(const [key,rows] of byTripStore.entries()){
    rows.sort((a,b)=>Number(a.route_position)-Number(b.route_position));
    const [tripId,store]=key.split("||");
    const route=rows.map(r=>r.item_name).filter(Boolean);

    aggregate[store]??={};
    for(let i=0;i<route.length;i++){
      for(let j=i+1;j<route.length;j++){
        if(route[i]===route[j])continue;
        const pair=route[i]+"|"+route[j];
        aggregate[store][pair]=(aggregate[store][pair]||0)+1;
      }
    }

    const trip=tripMap.get(tripId);
    const tripTime=trip?.completed_at||trip?.created_at||new Date().toISOString();
    if(!latest[store] || new Date(tripTime)>new Date(latest[store].completed_at)){
      latest[store]={route,tripId,completed_at:tripTime};
    }
  }

  const delPairs=await db.from("route_pairs").delete().eq("user_id",uid);
  if(delPairs.error)throw delPairs.error;
  const pairRows=[];
  for(const [store,stats] of Object.entries(aggregate)){
    for(const [key,count] of Object.entries(stats)){
      const split=key.indexOf("|");
      if(split<0)continue;
      const a=key.slice(0,split),b=key.slice(split+1);
      pairRows.push({user_id:uid,store_name:store,item_a_name:a,item_b_name:b,observations:count,last_observed_at:new Date().toISOString()});
    }
  }
  if(pairRows.length){
    const ins=await db.from("route_pairs").insert(pairRows);
    if(ins.error)throw ins.error;
  }

  const delLatest=await db.from("latest_store_routes").delete().eq("user_id",uid);
  if(delLatest.error)throw delLatest.error;
  const latestRows=Object.entries(latest).map(([store,data])=>({
    user_id:uid,
    store_name:store,
    trip_id:data.tripId,
    route_items:data.route,
    completed_at:data.completed_at
  }));
  if(latestRows.length){
    const ins=await db.from("latest_store_routes").insert(latestRows);
    if(ins.error)throw ins.error;
  }

  // Keep the current device's in-memory route learning aligned with the cloud
  // aggregates after rebuilding from all completed trips.
  state.orderStatsByStore={};
  for(const [store,stats] of Object.entries(aggregate))state.orderStatsByStore[store]={...stats};
  state.lastRoutesByStore={};
  for(const [store,data] of Object.entries(latest))state.lastRoutesByStore[store]=[...data.route];
  saveLocal();
}
async function syncMasterData(){
  const uid=currentUser.id;

  // Upsert local categories and stores first. During migration this is a union of
  // local + cloud data, so nothing that exists on either side is intentionally lost.
  const cats=state.categories.map((name,i)=>({user_id:uid,name,sort_order:i}));
  let r=await db.from("categories").upsert(cats,{onConflict:"user_id,name"});
  if(r.error)throw r.error;

  const stores=state.stores.map((name,i)=>({user_id:uid,name,sort_order:i}));
  r=await db.from("stores").upsert(stores,{onConflict:"user_id,name"});
  if(r.error)throw r.error;

  // IMPORTANT: do not delete remote categories/stores during migration or normal
  // sync. Deletion is handled explicitly by the user's Delete action in the app.
  // This avoids a transient/null response from turning into a destructive migration.
  const {data:cats2,error:ce}=await db.from("categories").select("id,name").eq("user_id",uid);
  if(ce)throw ce;
  const {data:stores2,error:se}=await db.from("stores").select("id,name").eq("user_id",uid);
  if(se)throw se;

  const safeCats=Array.isArray(cats2)?cats2:[];
  const safeStores=Array.isArray(stores2)?stores2:[];
  const catMap=Object.fromEntries(safeCats.map(x=>[x.name,x.id]));
  const storeMap=Object.fromEntries(safeStores.map(x=>[x.name,x.id]));

  const rows=state.items.map((x,i)=>({
    user_id:uid,
    name:x.name,
    category_id:catMap[x.category]||null,
    default_store_id:storeMap[x.store||"PAK'nSAVE"]||null,
    usual_quantity:Number(x.usualQty)||1,
    usual_unit:x.usualUnit||"each",
    sort_order:i
  }));
  r=await db.from("master_items").upsert(rows,{onConflict:"user_id,name"});
  if(r.error)throw r.error;

  const {data:ritems,error:ri}=await db.from("master_items").select("id,name").eq("user_id",uid);
  if(ri)throw ri;
  const safeItems=Array.isArray(ritems)?ritems:[];

  // Do not use Array.filter on an uncertain API payload. The API should return an
  // array, but treating a missing payload as [] avoids the null.filter crash seen
  // during migration.
  const localItemNames=new Set(state.items.map(i=>i.name));
  const deadItems=safeItems.filter(x=>!localItemNames.has(x.name));
  if(deadItems.length){
    r=await db.from("master_items").delete().in("id",deadItems.map(x=>x.id));
    if(r.error)throw r.error;
  }

  await syncOpenTrip();
}
async function syncToCloud(forceRoutes=false){if(!currentUser||!cloudReady||syncing)return false;syncing=true;try{setSyncStatus("Syncing…");await syncMasterData();if(forceRoutes)await replaceCloudRoutes();localDirty=false;setCloudSnapshotSignature(currentUser.id,state);deviceLocalDataAvailable=false;setSyncStatus("Synced");return true}catch(err){console.error(err);setSyncStatus("Sync error");return false}finally{syncing=false}}
async function syncNow(){
  if(!currentUser||!cloudReady||syncing)return;
  syncing=true;
  const btn=document.getElementById("syncNowBtn");
  if(btn)btn.disabled=true;
  try{
    setSyncStatus("Syncing…");
    // Never discard unsaved local changes. Push them first, then pull the
    // authoritative cloud state back down so both devices converge.
    if(localDirty){
      await syncMasterData();
      await replaceCloudRoutes();
      localDirty=false;
    }
    const remote=await fetchRemoteState();
    await downloadIntoLocal(remote);
    setCloudSnapshotSignature(currentUser.id,state);
    deviceLocalDataAvailable=false;
    setSyncStatus("Synced");
    render();
  }catch(err){
    console.error("Manual sync error:",err);
    setSyncStatus("Sync error");
    alert(`Sync failed.\n\n${err?.message||String(err)}`);
  }finally{
    syncing=false;
    if(btn)btn.disabled=false;
  }
}
function queueCloudSync(forceRoutes=false){if(!currentUser||!cloudReady)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>syncToCloud(forceRoutes),400)}

async function signIn(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||!password){setAuthMsg("Enter your email and password.");return}setAuthMsg("Signing in…",false);const {error}=await db.auth.signInWithPassword({email,password});if(error){setAuthMsg(error.message);return}setAuthMsg("Sign-in successful. Loading your Shop Path…",false)}
async function signUp(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||!password){setAuthMsg("Enter your email and password.");return}setAuthMsg("Creating account…",false);const {data,error}=await db.auth.signUp({email,password});if(error){setAuthMsg(error.message);return}if(data.session){setAuthMsg("Account created. Loading your Shop Path…",false)}else setAuthMsg("Account created. Check your email to confirm your account, then sign in.",false)}
async function resetPassword(){const email=document.getElementById("authEmail").value.trim();if(!email){setAuthMsg("Enter your email address first.");return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});setAuthMsg(error?error.message:"If that email has an account, Supabase will send password-reset instructions.",!error)}
async function bootAuthenticated(user){
  currentUser=user;loadLocal();document.getElementById("userEmail").textContent=user.email||"";authVisible(false);setAuthMsg("");setSyncStatus("Connecting…");
  try{await loadCloudOrMigrate();cloudReady=true;render();}catch(err){console.error("Supabase boot error:",err);cloudReady=false;setSyncStatus("Cloud setup needed");render();const code=err?.code?` [${err.code}]`:"";const msg=err?.message||String(err);alert(`Shop Path could not complete cloud setup.${code}\n\n${msg}`)}
}
async function signOut(){await db.auth.signOut();currentUser=null;cloudReady=false;authVisible(true);setAuthMsg("Signed out.",false)}

document.getElementById("signInBtn").onclick=()=>signIn();document.getElementById("signUpBtn").onclick=()=>signUp();document.getElementById("resetBtn").onclick=()=>resetPassword();document.getElementById("signOutBtn").onclick=()=>signOut();document.getElementById("syncNowBtn").onclick=()=>syncNow();
["authEmail","authPassword"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")signIn()}));
document.getElementById("tabShop").onclick=()=>{view="shop";setTabs();render()};document.getElementById("tabMaster").onclick=()=>{view="master";setTabs();render()};document.getElementById("tabRoute").onclick=()=>{view="route";setTabs();render()};
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById(view==="master"?"tabMaster":view==="route"?"tabRoute":"tabShop").classList.add("active")}

db.auth.onAuthStateChange(async (_event,session)=>{if(session&&!currentUser){try{await bootAuthenticated(session.user)}catch(e){console.error(e)}}else if(!session&&currentUser){currentUser=null;cloudReady=false;authVisible(true)}});
(async()=>{const {data}=await db.auth.getSession();if(data.session)await bootAuthenticated(data.session.user);else{loadLocal();authVisible(true)}})();
</script>
